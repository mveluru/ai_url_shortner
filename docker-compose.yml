# Local infrastructure for the prototype (design doc section 18 step 1; images per section 20.2).
services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4"]     # short_code's utf8mb4_bin collation is set per-column by Flyway
    environment:
      MYSQL_DATABASE: urlshortener
      MYSQL_USER: urlshortener
      MYSQL_PASSWORD: urlshortener
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]           # 15672 = management UI (guest/guest)
  prometheus:                                      # optional: docker compose --profile observability up
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./ops/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
