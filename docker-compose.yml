# Local infrastructure for the prototype (design doc section 18 step 1; images per section 20.2).
services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4"]     # short_code's utf8mb4_bin collation is set per-column by Flyway
    environment:
      MYSQL_DATABASE: urlshortener
      MYSQL_USER: urlshortener
      MYSQL_PASSWORD: urlshortener
      MYSQL_ROOT_PASSWORD: root
    ports: ["${MYSQL_PORT:-3306}:3306"]      # set MYSQL_PORT if 3306 is taken locally (then also set DB_URL)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]          # same variable name the app reads, so one export configures both
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["${RABBIT_PORT:-5672}:5672", "${RABBIT_MGMT_PORT:-15672}:15672"]   # 15672 = management UI (guest/guest); RABBIT_PORT is also read by the app
  prometheus:                                      # optional: docker compose --profile observability up
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./ops/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
