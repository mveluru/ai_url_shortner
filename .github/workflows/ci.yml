name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, design-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Design coverage check (scripts/verify-design-coverage.py)
        run: python3 scripts/verify-design-coverage.py

      - name: Build + full verify (unit, integration, failure-injection; Checkstyle/SpotBugs report-only)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload failsafe/surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            url-shortener-service/target/surefire-reports
            url-shortener-service/target/failsafe-reports
          retention-days: 7
